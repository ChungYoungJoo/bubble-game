<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>버블 드래곤</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b1e;color:#fff;font-family:"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  canvas{image-rendering:pixelated;background:#000;border:2px solid #3a3a7a;border-radius:4px}
  #pad{display:none;width:100%;max-width:520px;justify-content:space-between;padding:10px 14px;box-sizing:border-box}
  #pad div{display:flex;gap:10px}
  #pad button{width:72px;height:72px;border-radius:50%;border:2px solid #6a6aff;background:#1c1c4a;color:#fff;font-size:26px;touch-action:none}
  #pad button.on{background:#4a4aff}
  #pad button.act{border-color:#ffd24a;background:#4a3a10}
  #pad button.act.on{background:#a77f10}
  @media (pointer:coarse){#pad{display:flex}}
  #hint{font-size:12px;color:#8888bb;margin-top:6px}
  @media (pointer:coarse){#hint{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="256" height="224"></canvas>
  <div id="hint">← → 이동 · ↑/Z 점프 · Space/X 거품 · Enter 시작 &nbsp;|&nbsp; 게임패드 지원</div>
  <div id="pad">
    <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div><button class="act" data-k="jump">⤒</button><button class="act" data-k="shoot">●</button></div>
  </div>
</div>
<script src="game.js"></script>
<script src="draw.js"></script>
</body>
</html>
